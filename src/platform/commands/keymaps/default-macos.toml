# Default keybindings on macOS. See default-windows.toml for the format.

[global]
"f10" = "workbench.openMenuBar"
"cmd-," = "preferences.openSettings"
"cmd-q" = "app.quit"

# Search and commands.
"mod-k" = "workbench.quickOpen"
"mod-shift-p" = "workbench.showCommandPalette"
"f1" = "workbench.showCommandPalette"

# Workspace.
"mod-k mod-o" = "workspace.openFolder"

# Layout.
"mod-b" = "workbench.toggleSidebar"
"mod-j" = "workbench.togglePanel"
"mod-shift-e" = "workbench.showExplorer"
"mod-shift-f" = "workbench.showSearch"
"ctrl-shift-g" = "workbench.showSourceControl"
"mod-shift-d" = "workbench.showRunAndDebug"
"mod-shift-x" = "workbench.showExtensions"

# Tabs.
"mod-w" = "workbench.closeTab"
"ctrl-tab" = "workbench.nextTab"
"ctrl-shift-tab" = "workbench.previousTab"

[editor]
"left" = "editor.moveLeft"
"right" = "editor.moveRight"
"up" = "editor.moveUp"
"down" = "editor.moveDown"
"alt-left" = "editor.moveWordLeft"
"alt-right" = "editor.moveWordRight"
"cmd-left" = "editor.moveToLineStart"
"cmd-right" = "editor.moveToLineEnd"
"home" = "editor.moveToLineStart"
"end" = "editor.moveToLineEnd"
"cmd-up" = "editor.moveToDocumentStart"
"cmd-down" = "editor.moveToDocumentEnd"
"pageup" = "editor.pageUp"
"pagedown" = "editor.pageDown"
"shift-left" = "editor.selectLeft"
"shift-right" = "editor.selectRight"
"shift-up" = "editor.selectUp"
"shift-down" = "editor.selectDown"
"alt-shift-left" = "editor.selectWordLeft"
"alt-shift-right" = "editor.selectWordRight"
"cmd-shift-left" = "editor.selectToLineStart"
"cmd-shift-right" = "editor.selectToLineEnd"
"shift-home" = "editor.selectToLineStart"
"shift-end" = "editor.selectToLineEnd"
"cmd-shift-up" = "editor.selectToDocumentStart"
"cmd-shift-down" = "editor.selectToDocumentEnd"
"shift-pageup" = "editor.selectPageUp"
"shift-pagedown" = "editor.selectPageDown"
"cmd-alt-up" = "editor.addCursorAbove"
"cmd-alt-down" = "editor.addCursorBelow"
"escape" = "editor.singleCursor"
"cmd-a" = "editor.selectAll"
"cmd-z" = "editor.undo"
"cmd-shift-z" = "editor.redo"
"cmd-c" = "editor.copy"
"cmd-x" = "editor.cut"
"cmd-v" = "editor.paste"
"backspace" = "editor.deleteLeft"
"shift-backspace" = "editor.deleteLeft"
"delete" = "editor.deleteRight"
"alt-backspace" = "editor.deleteWordLeft"
"alt-delete" = "editor.deleteWordRight"
"enter" = "editor.newline"
"shift-enter" = "editor.newline"
"tab" = "editor.indent"
"shift-tab" = "editor.outdent"
"cmd-s" = "editor.save"
"ctrl-space" = "editor.triggerSuggest"
"cmd-k cmd-i" = "editor.showHover"
"f12" = "editor.goToDefinition"
