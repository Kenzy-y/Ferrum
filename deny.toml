# cargo-deny configuration. The license list mirrors AGENTS.md, section 3.
# Changing it requires the owner's approval.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    "Unicode-3.0",
]

# Per-crate exceptions. Never allow a license globally here: each entry names
# one crate.
# - `OFL-1.1` is allowed for font and icon crates only (AGENTS.md, section 3).
# - Anything else (for example `MPL-2.0`) needs the owner's approval per crate.
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
