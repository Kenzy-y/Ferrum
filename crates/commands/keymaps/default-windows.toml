# Default keybindings on Windows. Tables are contexts; `global` applies
# everywhere. Keys use `ctrl`, `alt`, `shift`, `cmd` (the Windows key) and
# `mod` (Ctrl on Windows and Linux, Cmd on macOS).

[global]
"alt-f4" = "app.quit"

# Layout.
"mod-b" = "workbench.toggleSidebar"
"mod-j" = "workbench.togglePanel"
"mod-shift-e" = "workbench.showExplorer"
"mod-shift-f" = "workbench.showSearch"
"ctrl-shift-g" = "workbench.showSourceControl"
"mod-shift-d" = "workbench.showRunAndDebug"
"mod-shift-x" = "workbench.showExtensions"

# Temporary component gallery (stage 1).
"mod-k mod-g" = "workbench.toggleComponentGallery"
