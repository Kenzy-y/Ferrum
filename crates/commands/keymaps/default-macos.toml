# Default keybindings on macOS. See default-windows.toml for the format.

[global]
"cmd-q" = "app.quit"

# Search and commands.
"mod-k" = "workbench.quickOpen"
"mod-shift-p" = "workbench.showCommandPalette"
"f1" = "workbench.showCommandPalette"

# Layout.
"mod-b" = "workbench.toggleSidebar"
"mod-j" = "workbench.togglePanel"
"mod-shift-e" = "workbench.showExplorer"
"mod-shift-f" = "workbench.showSearch"
"ctrl-shift-g" = "workbench.showSourceControl"
"mod-shift-d" = "workbench.showRunAndDebug"
"mod-shift-x" = "workbench.showExtensions"
